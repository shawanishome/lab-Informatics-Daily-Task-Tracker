<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1c2e;
    --navy-mid: #1a2e45;
    --navy-light: #243b55;
    --accent: #00d4aa;
    --accent2: #ff6b6b;
    --accent3: #ffd93d;
    --text: #e8f0fe;
    --text-muted: #8ba3c1;
    --janhavi: #4fc3f7;
    --janhavi-bg: rgba(79,195,247,0.08);
    --abisheik: #81c784;
    --abisheik-bg: rgba(129,199,132,0.08);
    --ritika: #ffb74d;
    --ritika-bg: rgba(255,183,77,0.08);
    --shawani: #f48fb1;
    --shawani-bg: rgba(244,143,177,0.08);
    --weekend-bg: rgba(255,255,255,0.03);
    --holiday-bg: rgba(255,107,107,0.12);
    --optional-bg: rgba(255,217,61,0.10);
    --border: rgba(255,255,255,0.07);
    --row-hover: rgba(0,212,170,0.06);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 10%, rgba(0,212,170,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(79,195,247,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; padding: 24px; max-width: 100%; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), #4fc3f7);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  h1 {
    font-size: 24px; font-weight: 700;
    background: linear-gradient(90deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Controls */
  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }

  .month-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
  }
  .month-tab {
    padding: 6px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    cursor: pointer; border: none;
    background: transparent; color: var(--text-muted);
    transition: all 0.2s;
    font-family: 'Outfit', sans-serif;
  }
  .month-tab:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .month-tab.active { background: var(--accent); color: var(--navy); font-weight: 600; }

  /* Legend */
  .legend {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 20px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }

  /* Member chips */
  .member-chips {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .chip {
    padding: 5px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1.5px solid;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .chip.janhavi { border-color: var(--janhavi); color: var(--janhavi); }
  .chip.janhavi.active { background: var(--janhavi); color: var(--navy); }
  .chip.abisheik { border-color: var(--abisheik); color: var(--abisheik); }
  .chip.abisheik.active { background: var(--abisheik); color: var(--navy); }
  .chip.ritika { border-color: var(--ritika); color: var(--ritika); }
  .chip.ritika.active { background: var(--ritika); color: var(--navy); }
  .chip.shawani { border-color: var(--shawani); color: var(--shawani); }
  .chip.shawani.active { background: var(--shawani); color: var(--navy); }
  .chip.all { border-color: var(--accent); color: var(--accent); }
  .chip.all.active { background: var(--accent); color: var(--navy); }

  /* Table wrapper */
  .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
    font-size: 12.5px;
  }

  /* Sticky columns */
  thead th { position: sticky; top: 0; z-index: 10; }
  td:first-child, th:first-child { position: sticky; left: 0; z-index: 5; }
  td:nth-child(2), th:nth-child(2) { position: sticky; left: 96px; z-index: 5; }
  thead th:first-child, thead th:nth-child(2) { z-index: 15; }

  /* Header rows */
  .th-top {
    background: var(--navy-light);
    color: var(--text);
    padding: 12px 10px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-bottom: 2px solid var(--accent);
    white-space: nowrap;
  }
  .th-member {
    text-align: center;
    padding: 8px 6px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    border-right: 2px solid var(--border);
  }
  .th-member.janhavi { background: rgba(79,195,247,0.15); color: var(--janhavi); }
  .th-member.abisheik { background: rgba(129,199,132,0.15); color: var(--abisheik); }
  .th-member.ritika { background: rgba(255,183,77,0.15); color: var(--ritika); }
  .th-member.shawani { background: rgba(244,143,177,0.15); color: var(--shawani); }

  .th-sub {
    text-align: center;
    padding: 6px 4px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  /* Data cells */
  td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:hover td { background-color: var(--row-hover) !important; }

  .td-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    background: var(--navy-mid);
    min-width: 94px;
  }
  .td-day {
    font-size: 11px; font-weight: 500;
    min-width: 100px;
    white-space: nowrap;
    background: var(--navy-mid);
  }
  .td-task { min-width: 140px; }
  .td-date-cell {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-width: 90px;
  }
  .td-status { min-width: 105px; }
  .td-comments { min-width: 130px; }

  /* Row states */
  .row-weekend td { opacity: 0.5; }
  .row-weekend .td-day { color: var(--text-muted) !important; }
  .row-weekend .row-badge { display: inline-block; }

  .row-holiday td { background: var(--holiday-bg) !important; }
  .row-optional td { background: var(--optional-bg) !important; }

  .row-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge-weekend { background: rgba(255,255,255,0.1); color: var(--text-muted); }
  .badge-holiday { background: rgba(255,107,107,0.25); color: var(--accent2); }
  .badge-optional { background: rgba(255,217,61,0.2); color: var(--accent3); }

  /* Editable cells */
  td[contenteditable="true"] {
    outline: none;
    cursor: text;
    min-height: 28px;
  }
  td[contenteditable="true"]:focus {
    background: rgba(0,212,170,0.1) !important;
    box-shadow: inset 0 0 0 1.5px var(--accent);
    border-radius: 4px;
  }

  /* Status dropdown */
  .status-select {
    width: 100%;
    padding: 3px 6px;
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 11px;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
  }
  .status-select:focus { border-color: var(--accent); }
  .status-select option { background: var(--navy-mid); }

  .status-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px;
  }

  /* Member column groups */
  .col-janhavi { border-right: 0; }
  .col-janhavi-last { border-right: 2px solid rgba(79,195,247,0.2) !important; }
  .col-abisheik-last { border-right: 2px solid rgba(129,199,132,0.2) !important; }
  .col-ritika-last { border-right: 2px solid rgba(255,183,77,0.2) !important; }
  .col-shawani-last { border-right: 2px solid rgba(244,143,177,0.2) !important; }

  .cell-janhavi { background: var(--janhavi-bg); }
  .cell-abisheik { background: var(--abisheik-bg); }
  .cell-ritika { background: var(--ritika-bg); }
  .cell-shawani { background: var(--shawani-bg); }

  /* Export btn */
  .export-btn {
    padding: 8px 18px;
    background: var(--accent);
    color: var(--navy);
    border: none; border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .export-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

  /* Month summary pill */
  .month-summary {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px;
    font-size: 12px; color: var(--text-muted);
  }
  .summary-chip {
    padding: 4px 12px; border-radius: 20px;
    background: var(--navy-mid);
    border: 1px solid var(--border);
  }
  .summary-chip span { color: var(--text); font-weight: 600; }

  /* Hidden member col */
  .member-hidden { display: none !important; }

  /* Scrollbar */
  .table-wrap::-webkit-scrollbar { height: 6px; }
  .table-wrap::-webkit-scrollbar-track { background: var(--navy-mid); }
  .table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  @media print {
    body { background: white; color: black; }
    .controls, .month-tabs, .export-btn, .legend { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">📋</div>
      <div>
        <h1>Team Task Tracker 2026</h1>
        <div class="subtitle">Daily activity log · May – December 2026</div>
      </div>
    </div>
    <div class="controls">
      <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
    </div>
  </header>

  <div class="month-tabs" id="monthTabs"></div>

  <div style="height:16px"></div>

  <div class="legend">
    <strong style="color:var(--text)">Legend:</strong>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div> Working Day</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,0.2)"></div> Weekend</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div> Public Holiday</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div> Optional Holiday</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--janhavi)"></div> Janhavi</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--abisheik)"></div> Abisheik</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--ritika)"></div> Ritika</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--shawani)"></div> Shawani</div>
  </div>

  <div class="member-chips">
    <div class="chip all active" onclick="filterMembers('all')">All Members</div>
    <div class="chip janhavi" onclick="filterMembers('janhavi')">Janhavi</div>
    <div class="chip abisheik" onclick="filterMembers('abisheik')">Abisheik</div>
    <div class="chip ritika" onclick="filterMembers('ritika')">Ritika</div>
    <div class="chip shawani" onclick="filterMembers('shawani')">Shawani</div>
  </div>

  <div id="monthSummary" class="month-summary"></div>

  <div class="table-wrap">
    <table id="tracker">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const MEMBERS = [
  { key: 'janhavi',  name: 'Janhavi',  color: '#4fc3f7' },
  { key: 'abisheik', name: 'Abisheik', color: '#81c784' },
  { key: 'ritika',   name: 'Ritika',   color: '#ffb74d' },
  { key: 'shawani',  name: 'Shawani',  color: '#f48fb1' },
];

const HOLIDAYS = {
  '2026-05-27': { name: 'Eidul Azha (Bakrid)', optional: true },
  '2026-06-02': { name: 'Telangana Formation Day', optional: false },
  '2026-08-10': { name: 'Bonalu', optional: true },
  '2026-08-15': { name: 'Independence Day', optional: false },
  '2026-09-04': { name: 'Sri Krishna Astami', optional: true },
  '2026-09-14': { name: 'Vinayak Chavithi', optional: false },
  '2026-10-02': { name: 'Gandhi Jayanti', optional: false },
  '2026-10-20': { name: 'Vijaya Dasami / Dushera', optional: false },
  '2026-11-08': { name: 'Deepavali', optional: false },
  '2026-11-09': { name: 'Day after Deepavali', optional: true },
  '2026-11-24': { name: 'Kartika Purnima / Guru Nanak Jayanti', optional: true },
  '2026-12-25': { name: 'Christmas', optional: false },
};

const MONTHS = [
  { m: 5, name: 'May', days: 31 },
  { m: 6, name: 'Jun', days: 30 },
  { m: 7, name: 'Jul', days: 31 },
  { m: 8, name: 'Aug', days: 31 },
  { m: 9, name: 'Sep', days: 30 },
  { m: 10, name: 'Oct', days: 31 },
  { m: 11, name: 'Nov', days: 30 },
  { m: 12, name: 'Dec', days: 31 },
];

// Data store: key = "YYYY-MM-DD_memberKey_field"
const DATA = JSON.parse(localStorage.getItem('tracker_data_2026') || '{}');

function saveData() {
  localStorage.setItem('tracker_data_2026', JSON.stringify(DATA));
}

function pad(n) { return n.toString().padStart(2, '0'); }

function dateKey(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }

function getDays(monthIdx) {
  const { m, days } = MONTHS[monthIdx];
  const start = (m === 5) ? 20 : 1;
  const result = [];
  for (let d = start; d <= days; d++) {
    const dt = new Date(2026, m - 1, d);
    const dow = dt.getDay(); // 0=Sun,6=Sat
    const dk = dateKey(2026, m, d);
    const holiday = HOLIDAYS[dk] || null;
    result.push({
      d, m, dk,
      dayName: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow],
      dow,
      isWeekend: dow === 0 || dow === 6,
      isHoliday: !!holiday && !holiday.optional,
      isOptional: !!holiday && holiday.optional,
      holidayName: holiday ? holiday.name : null,
    });
  }
  return result;
}

let currentMonth = 0;
let currentFilter = 'all';

function renderMonthTabs() {
  const tabs = document.getElementById('monthTabs');
  tabs.innerHTML = MONTHS.map((mo, i) =>
    `<button class="month-tab ${i === 0 ? 'active' : ''}" onclick="switchMonth(${i})">${mo.name}</button>`
  ).join('');
}

function switchMonth(idx) {
  currentMonth = idx;
  document.querySelectorAll('.month-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  renderTable();
}

function filterMembers(key) {
  currentFilter = key;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector(`.chip.${key}`).classList.add('active');
  renderTable();
}

function getVisibleMembers() {
  if (currentFilter === 'all') return MEMBERS;
  return MEMBERS.filter(m => m.key === currentFilter);
}

function renderTable() {
  const days = getDays(currentMonth);
  const visible = getVisibleMembers();
  const { m, name } = MONTHS[currentMonth];
  
  // Summary
  const working = days.filter(d => !d.isWeekend && !d.isHoliday).length;
  const weekends = days.filter(d => d.isWeekend).length;
  const holidays = days.filter(d => d.isHoliday || d.isOptional).length;
  document.getElementById('monthSummary').innerHTML = `
    <div class="summary-chip">📅 <span>${name} 2026</span></div>
    <div class="summary-chip">✅ <span>${working}</span> working days</div>
    <div class="summary-chip">🏖 <span>${weekends}</span> weekends</div>
    <div class="summary-chip">🎉 <span>${holidays}</span> holidays</div>
  `;

  // Head
  const head = document.getElementById('tableHead');
  const SUB = ['Task/Activity','Start Date','Exp. End Date','Actual End Date','EOD Status','Comments'];
  
  let h1 = `<tr>
    <th class="th-top" rowspan="2" style="min-width:94px">Date</th>
    <th class="th-top" rowspan="2" style="min-width:100px">Day</th>
    ${visible.map(mem =>
      `<th class="th-member ${mem.key}" colspan="${SUB.length}">${mem.name}</th>`
    ).join('')}
  </tr>`;
  
  let h2 = `<tr>${visible.map(mem =>
    SUB.map((s, si) =>
      `<th class="th-sub ${si === SUB.length-1 ? `col-${mem.key}-last` : ''}" style="min-width:${s==='Comments'?120:s.includes('Task')?130:s==='EOD Status'?100:85}px">${s}</th>`
    ).join('')
  ).join('')}</tr>`;
  
  head.innerHTML = h1 + h2;

  // Body
  const body = document.getElementById('tableBody');
  const rows = days.map(day => {
    const { dk, dayName, isWeekend, isHoliday, isOptional, holidayName } = day;
    let rowClass = '';
    if (isWeekend) rowClass = 'row-weekend';
    else if (isHoliday) rowClass = 'row-holiday';
    else if (isOptional) rowClass = 'row-optional';
    
    const badgeHtml = isWeekend 
      ? `<span class="row-badge badge-weekend">WKD</span>` 
      : isHoliday 
        ? `<span class="row-badge badge-holiday">HOLIDAY</span>`
        : isOptional
          ? `<span class="row-badge badge-optional">OPT</span>`
          : '';

    const dayDisplay = isWeekend ? `${dayName}${badgeHtml}` 
      : (isHoliday || isOptional) ? `${dayName} — ${holidayName}${badgeHtml}`
      : dayName;

    const disabled = isWeekend || isHoliday;

    const [, , d] = dk.split('-');
    const dateDisplay = `${d} ${['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][day.m]}`;

    const memberCells = visible.map(mem => {
      const k = `${dk}_${mem.key}`;
      const task = DATA[k+'_task'] || '';
      const start = DATA[k+'_start'] || '';
      const expEnd = DATA[k+'_expend'] || '';
      const actEnd = DATA[k+'_actend'] || '';
      const status = DATA[k+'_status'] || '';
      const comment = DATA[k+'_comment'] || '';

      const statuses = ['', 'Not Started', 'In Progress', 'Completed', 'Blocked', 'On Hold'];
      const statusOpts = statuses.map(s => 
        `<option value="${s}" ${status === s ? 'selected' : ''}>${s}</option>`
      ).join('');

      if (disabled) {
        return SUB.map((_, si) => 
          `<td class="cell-${mem.key} ${si === SUB.length-1 ? `col-${mem.key}-last` : ''}" style="color:var(--text-muted);font-size:11px">—</td>`
        ).join('');
      }

      return `
        <td class="td-task cell-${mem.key}" contenteditable="true" 
          data-key="${k}_task" onblur="saveCell(this)">${task}</td>
        <td class="td-date-cell cell-${mem.key}" contenteditable="true"
          data-key="${k}_start" onblur="saveCell(this)" placeholder="DD-MM">${start}</td>
        <td class="td-date-cell cell-${mem.key}" contenteditable="true"
          data-key="${k}_expend" onblur="saveCell(this)">${expEnd}</td>
        <td class="td-date-cell cell-${mem.key}" contenteditable="true"
          data-key="${k}_actend" onblur="saveCell(this)">${actEnd}</td>
        <td class="td-status cell-${mem.key} col-${mem.key}-last" style="padding:4px">
          <select class="status-select" data-key="${k}_status" onchange="saveSelect(this)">
            ${statusOpts}
          </select>
        </td>
        <td class="td-comments cell-${mem.key} col-${mem.key}-last" contenteditable="true"
          data-key="${k}_comment" onblur="saveCell(this)">${comment}</td>
      `;
    }).join('');

    return `<tr class="${rowClass}">
      <td class="td-date">${dateDisplay}</td>
      <td class="td-day">${dayDisplay}</td>
      ${memberCells}
    </tr>`;
  });
  
  body.innerHTML = rows.join('');
}

function saveCell(el) {
  const key = el.dataset.key;
  DATA[key] = el.innerText.trim();
  saveData();
}

function saveSelect(el) {
  const key = el.dataset.key;
  DATA[key] = el.value;
  saveData();
}

function exportCSV() {
  const days = getDays(currentMonth);
  const { name } = MONTHS[currentMonth];
  const SUB = ['Task', 'Start Date', 'Exp End Date', 'Actual End Date', 'EOD Status', 'Comments'];
  
  const headers = ['Date', 'Day', ...MEMBERS.flatMap(m => SUB.map(s => `${m.name} - ${s}`))];
  const rows = days.filter(d => !d.isWeekend && !d.isHoliday).map(day => {
    const { dk, dayName } = day;
    const [y, mo, d] = dk.split('-');
    const cells = MEMBERS.flatMap(mem => {
      const k = `${dk}_${mem.key}`;
      return [
        DATA[k+'_task'] || '',
        DATA[k+'_start'] || '',
        DATA[k+'_expend'] || '',
        DATA[k+'_actend'] || '',
        DATA[k+'_status'] || '',
        DATA[k+'_comment'] || '',
      ];
    });
    return [`${d}-${mo}-${y}`, dayName, ...cells];
  });

  const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `task_tracker_${name}_2026.csv`;
  a.click();
}

// Init
renderMonthTabs();
renderTable();
</script>
</body>
</html>
